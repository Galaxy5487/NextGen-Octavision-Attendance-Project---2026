[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Reverse Proxy /api/* to Render backend (Zero CORS, same domain)
[[redirects]]
  from = "/api/*"
  to = "https://nextgen-octavision-attendance-i2is.onrender.com/api/:splat"
  status = 200
  force = true

# React Router SPA catch-all redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200



